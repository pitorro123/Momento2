<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-8 relative overflow-x-hidden">

   <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_left,_rgba(147,51,234,0.3),_transparent_50%)]"></div>
  <div class="fixed inset-0 -z-10 bg-[radial-gradient(circle_at_right,_rgba(16,185,129,0.25),_transparent_50%)]"></div>
  <form class="bg-gray-900 p-6 rounded-xl max-w-md mx-auto flex flex-col gap-4">

    <h2 class="text-xl font-bold text-white flex justify-center">Nuevo Producto</h2>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-gray-400">Nombre</label>
      <input type="text" id="nombre" placeholder="Ej: Tennis Nike Air Max"
        class="bg-gray-800 text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-100" />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm text-gray-400">Categoría</label>
      <select id="categoria"
        class="bg-gray-800 text-white px-4 py-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-300">
        <option value="">— Seleccionar —</option>
        <option value="Tennis">Tennis</option>
        <option value="Jeans">Jeans</option>
        <option value="Camisas">Camisas</option>
      </select>
    </div>

    <div class="flex gap-3">

      <div class="flex flex-col gap-1 flex-1">
        <label class="text-sm text-gray-400">Precio ($)</label>
        <input type="number" id="precio" placeholder="0.00"
          class="bg-gray-800 text-white px-1 py-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>

      <div class="flex flex-col gap-1 flex-1">
        <label class="text-sm text-gray-400">Stock</label>
        <input type="number" id="stock" placeholder="0"
          class="bg-gray-800 text-white px-1 py-2 rounded-lg outline-none focus:ring-2 focus:ring-indigo-300" />
      </div>

    </div>

    <button type="button" id="btn-agregar"
      class="bg-indigo-700 text-gray-950 font-bold py-2 rounded-lg hover:bg-indigo-600 transition">
       Guardar Producto
    </button>
    </form>
    <!-- Filtros de categoría -->
<div class="max-w-md mx-auto mt-4 flex flex-wrap gap-2">
  <button class="btn-filtro bg-yellow-400 text-gray-950 font-bold px-4 py-2 rounded-lg hover:bg-yellow-300 transition" data-categoria="">
    Todos
  </button>
  <button class="btn-filtro bg-gray-700 text-white font-bold px-4 py-2 rounded-lg hover:bg-gray-600 transition" data-categoria="Tennis">
    Tennis
  </button>
  <button class="btn-filtro bg-gray-700 text-white font-bold px-4 py-2 rounded-lg hover:bg-gray-600 transition" data-categoria="Jeans">
    Jeans
  </button>
  <button class="btn-filtro bg-gray-700 text-white font-bold px-4 py-2 rounded-lg hover:bg-gray-600 transition" data-categoria="Camisas">
    Camisas
  </button>
</div>
  
    <div class="max-w-md mx-auto mt-6 flex flex-col gap-3" id="area-resultados">

      <p class="text-center text-gray-500 mt-4" id="empty-state">
        No hay productos aún. ¡Agrega el primero!
      </p>

    </div>

  
 <script src="app.js"></script>
</body>

</body>
</html>
